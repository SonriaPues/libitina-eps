# Revisión semanal de dependencias con vulnerabilidades conocidas (recomendación R4).
# Dependabot abre un pull request con la versión corregida; la integración continua lo prueba antes de unirlo.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/services/*"]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
