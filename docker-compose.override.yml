# =====================================================================
# DESARROLLO · Docker lo carga solo con `docker compose up`.
# Abre puertos SOLO en 127.0.0.1 (tu computador) y agrega Mailpit.
# En el servidor de Azure NO se usa (ver docker-compose.prod.yml).
# =====================================================================
services:
  db-general:  { ports: ["127.0.0.1:5432:5432"] }
  db-clinica:  { ports: ["127.0.0.1:5433:5432"] }
  auth:        { ports: ["127.0.0.1:8001:8000"] }
  afiliados:   { ports: ["127.0.0.1:8002:8000"] }
  notificaciones: { ports: ["127.0.0.1:8006:8000"] }
  prestadores: { ports: ["127.0.0.1:8007:8000"] }
  gateway:     { ports: ["8000:8000"] }

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
    networks: [interna]

  notificaciones-worker:
    depends_on: { mailpit: { condition: service_started } }

# Docker no publica puertos de redes internas: en desarrollo se abren.
networks:
  interna: { internal: false }
  datos:   { internal: false }
  clinica: { internal: false }
